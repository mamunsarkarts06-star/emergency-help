<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Help</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Emergency Help</h1>
    <p>In danger? Call 999 first.</p>
    <a href="tel:999" class="call-btn">Call 999</a>


                            <!--sarvis Card HTML start-->

    <div class="cards">
    <div class="card">
        <div class="icon">🚑</div>
        <h3>Ambulance</h3>
        <p>Find ambulance</p>
    </div>

    <div class="card">
        <div class="icon">🩸</div>
        <h3>Blood Donor</h3>
        <p>Find blood donors</p>
    </div>

    <div class="card">
        <div class="icon">👮</div>
        <h3>Police</h3>
        <p>Police stations</p>
    </div>

    <div class="card">
        <div class="icon">🚒</div>
        <h3>Fire Service</h3>
        <p>Fire stations</p>
    </div>
</div>



</body>
</html>
